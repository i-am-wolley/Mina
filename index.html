<style>
  @import url("https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800;900&family=Geist+Mono:wght@400;500;600;700&display=swap");

  :root {
    --cream-50:  #faf7f2;
    --cream-100: #f5f0ea;
    --cream-200: #f2ede8;
    --cream-300: #ece7e0;
    --sand-300:  #e2dcd5;
    --sand-400:  #c8c0b8;
    --sand-500:  #9e9890;
    --stone-600: #6b6560;
    --ink-900:   #18140f;
    --white:     #ffffff;

    --bronze-400: #c8a96e;
    --bronze-500: #b8935a;
    --bronze-600: #a07c46;
    --brand-amber: #e8a938;

    --sage-500: #6f9e80;        --sage-wash: #e8efe9;
    --amber-500: #e3a14e;       --amber-wash: #fbf0df;
    --terracotta-500: #e8876b;  --terracotta-wash: #fbe7e0;
    --lilac-500: #9c8fc2;       --lilac-wash: #eeebf5;
    --teal-500: #2aa7be;        --teal-wash: rgba(40,160,180,0.10);
    --danger-500: #c0392b;      --danger-wash: #f8e3e0;

    --surface-app: var(--cream-100);
    --surface-card: var(--white);
    --surface-sunken: var(--cream-300);
    --surface-overlay: rgba(0,0,0,0.85);

    --text-primary: var(--ink-900);
    --text-secondary: var(--stone-600);
    --text-tertiary: var(--sand-500);
    --text-on-accent: var(--white);

    --border-hairline: var(--sand-300);
    --border-strong: var(--sand-400);

    --accent: var(--bronze-500);
    --accent-hover: var(--bronze-600);
    --accent-wash: color-mix(in srgb, var(--accent) 12%, transparent);

    --color-gain: var(--sage-500);
    --color-loss: var(--danger-500);
    --severity-critical: var(--danger-500);   --severity-critical-wash: var(--danger-wash);
    --severity-high: var(--terracotta-500);   --severity-high-wash: var(--terracotta-wash);
    --severity-medium: var(--amber-500);      --severity-medium-wash: var(--amber-wash);
    --severity-watch: var(--lilac-500);       --severity-watch-wash: var(--lilac-wash);

    --font-sans: "Geist", "Inter", "DM Sans", system-ui, -apple-system, sans-serif;
    --font-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
    --fw-medium: 500; --fw-semibold: 600; --fw-emphasis: 650; --fw-bold: 700; --fw-heavy: 800; --fw-black: 900;
    --fs-title: 22px; --fs-heading: 17px; --fs-body: 15px; --fs-sm: 14px; --fs-meta: 13px;
    --fs-micro: 12px; --fs-label: 11px; --fs-stat: 28px; --fs-hero: 36px;
    --ls-display: -0.02em; --ls-label: 0.1em;

    --space-1: 4px; --space-2: 6px; --space-3: 8px; --space-4: 12px; --space-5: 14px;
    --space-6: 16px; --space-7: 20px; --space-8: 24px; --space-10: 32px; --space-12: 40px;
    --tap-min: 40px;
    --radius-sm: 8px; --radius-md: 12px; --radius-lg: 14px; --radius-xl: 16px; --radius-2xl: 20px; --radius-pill: 999px;
    --shadow-card: 0 2px 14px rgba(40,30,20,0.05);
    --shadow-nav: 0 2px 16px rgba(0,0,0,0.04);
    --dur-fast: 0.12s; --dur-mid: 0.3s; --dur-slow: 0.7s;
    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);

    --content-max-w: 1560px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --surface-app: #0d0d0d;
      --surface-card: #181818;
      --surface-sunken: #1e1e1e;
      --text-primary: #f2ede8;
      --text-secondary: #6a6a6a;
      --text-tertiary: #383838;
      --text-on-accent: #0d0d0d;
      --border-hairline: #252525;
      --border-strong: #303030;
      --accent: var(--bronze-400);
      --accent-hover: #d8bd86;
    }
  }
  @media (prefers-reduced-motion: reduce) { :root { --dur-fast: 0ms; --dur-mid: 0ms; --dur-slow: 0ms; } }

  /* ============================================================ */
  /* 02  Global styles · component primitives · motion              */
  /* ============================================================ */
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--surface-app);
    color: var(--text-primary);
    font-family: var(--font-sans);
    font-size: var(--fs-body);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  .tabular { font-variant-numeric: tabular-nums; }

  /* ---- Top nav (replaces the sidebar — more vertical estate on every screen) ---- */
  .topnav {
    display: flex; align-items: center; justify-content: space-between;
    padding: var(--space-4) var(--space-8);
    background: var(--surface-card); border-bottom: 1px solid var(--border-hairline);
    box-shadow: var(--shadow-nav);
    position: sticky; top: 0; z-index: 10;
  }
  .topnav-left { display: flex; align-items: center; gap: var(--space-10); }
  .topnav-logo { display: flex; align-items: center; gap: var(--space-3); }
  .topnav-logo-mark { width: 26px; height: 26px; border-radius: 7px; background: var(--ink-900); display: grid; grid-template-columns: 1fr 1fr; gap: 3px; padding: 5px; flex-shrink: 0; }
  .topnav-logo-mark span { background: var(--brand-amber); border-radius: var(--radius-pill); }
  .topnav-logo-mark span:nth-child(1) { opacity: 1; } .topnav-logo-mark span:nth-child(2) { opacity: 0.5; }
  .topnav-logo-mark span:nth-child(3) { opacity: 0.5; } .topnav-logo-mark span:nth-child(4) { opacity: 0.2; }
  .topnav-logo-word { font-size: 18px; font-weight: var(--fw-black); letter-spacing: var(--ls-display); }
  .topnav-logo-word .accent { color: var(--brand-amber); }
  .topnav-nav { display: flex; gap: 2px; }
  .topnav-link {
    display: flex; align-items: center; gap: var(--space-3);
    padding: var(--space-3) var(--space-5); border-radius: var(--radius-md);
    color: var(--text-secondary); font-weight: var(--fw-semibold); font-size: var(--fs-sm);
    cursor: pointer; border: none; background: none; font-family: var(--font-sans); transition: all var(--dur-fast);
  }
  .topnav-link:hover { background: var(--surface-sunken); color: var(--text-primary); }
  .topnav-link.active { background: var(--accent-wash); color: var(--accent); font-weight: var(--fw-bold); }
  .topnav-right { display: flex; align-items: center; gap: var(--space-6); }
  .household-switcher { display: flex; align-items: center; gap: var(--space-3); color: var(--text-secondary); }
  .household-switcher select {
    background: transparent; color: var(--text-primary); border: none;
    font-family: var(--font-sans); font-size: var(--fs-sm); font-weight: var(--fw-bold);
    -webkit-appearance: none; appearance: none; padding: 0; cursor: pointer;
  }
  .icon-btn {
    width: 36px; height: 36px; border-radius: var(--radius-md);
    display: flex; align-items: center; justify-content: center;
    background: var(--surface-sunken); border: 1px solid var(--border-hairline);
    color: var(--text-secondary); cursor: pointer;
  }
  .btn-add {
    display: inline-flex; align-items: center; gap: var(--space-3);
    padding: var(--space-3) var(--space-6); border-radius: var(--radius-md);
    background: var(--ink-900); color: var(--white); border: none;
    font-family: var(--font-sans); font-size: var(--fs-sm); font-weight: var(--fw-bold);
    cursor: pointer; transition: transform var(--dur-fast);
  }
  .btn-add:active { transform: scale(0.97); }

  .content { padding: var(--space-8) var(--space-10) var(--space-12); max-width: var(--content-max-w); margin: 0 auto; }

  .hero-value { font-family: var(--font-mono); font-size: var(--fs-hero); font-weight: var(--fw-bold); letter-spacing: var(--ls-display); line-height: 1.1; }
  .hero-deltas { display: flex; gap: var(--space-6); margin-top: var(--space-3); font-size: var(--fs-meta); }
  .delta { display: flex; align-items: center; gap: 4px; font-weight: var(--fw-bold); }
  .delta.up { color: var(--color-gain); }
  .delta.down { color: var(--color-loss); }
  .delta-label { color: var(--text-tertiary); font-weight: var(--fw-medium); }

  .section-label {
    font-size: var(--fs-label); font-weight: var(--fw-bold); letter-spacing: var(--ls-label);
    color: var(--text-tertiary); text-transform: uppercase;
    margin-bottom: var(--space-4);
  }

  .card {
    background: var(--surface-card);
    border: 1px solid var(--border-hairline);
    border-radius: var(--radius-xl);
    padding: var(--space-7);
    box-shadow: var(--shadow-card);
  }
  .card + .card { margin-top: var(--space-3); }
  .card-row { display: flex; align-items: center; gap: var(--space-4); }
  .card-icon {
    width: 34px; height: 34px; flex-shrink: 0; border-radius: var(--radius-md);
    display: flex; align-items: center; justify-content: center;
    background: var(--accent-wash); color: var(--accent);
  }
  .card-icon.tone-critical { background: var(--severity-critical-wash); color: var(--severity-critical); }
  .card-icon.tone-high { background: var(--severity-high-wash); color: var(--severity-high); }
  .card-icon.tone-medium { background: var(--severity-medium-wash); color: var(--severity-medium); }
  .card-icon.tone-watch { background: var(--severity-watch-wash); color: var(--severity-watch); }
  .card-body { flex: 1; min-width: 0; }
  .card-title { font-size: var(--fs-sm); font-weight: var(--fw-bold); display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; }
  .card-sub { font-size: var(--fs-meta); color: var(--text-secondary); margin-top: 2px; }
  .card-trailing { font-size: var(--fs-meta); font-weight: var(--fw-bold); color: var(--text-secondary); white-space: nowrap; }

  .badge {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 3px 9px; font-size: var(--fs-micro); font-weight: var(--fw-bold); line-height: 1.3;
    border-radius: var(--radius-pill);
  }
  .badge.tone-critical { background: var(--severity-critical-wash); color: var(--severity-critical); }
  .badge.tone-high { background: var(--severity-high-wash); color: var(--severity-high); }
  .badge.tone-medium { background: var(--severity-medium-wash); color: var(--severity-medium); }
  .badge.tone-watch { background: var(--severity-watch-wash); color: var(--severity-watch); }
  .badge.tone-gain { background: var(--sage-wash); color: var(--sage-500); }
  .badge.tone-loss { background: var(--danger-wash); color: var(--danger-500); }

  .sparkline-wrap { margin-top: var(--space-6); }
  .sparkline-path { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .sparkline-path.animate {
    stroke-dasharray: var(--dash-len); stroke-dashoffset: var(--dash-len);
    animation: draw-in var(--dur-slow) var(--ease-out) forwards;
  }
  @keyframes draw-in { to { stroke-dashoffset: 0; } }
  .sparkline-fill { opacity: 0.14; }

  .empty-state { text-align: center; padding: var(--space-12) var(--space-6); color: var(--text-secondary); }
  .empty-state-icon { color: var(--accent); margin-bottom: var(--space-4); display: flex; justify-content: center; }
  .empty-state-title { color: var(--text-primary); font-weight: var(--fw-bold); margin-bottom: var(--space-2); }

  .skeleton {
    background: linear-gradient(90deg, var(--surface-card) 25%, var(--surface-sunken) 37%, var(--surface-card) 63%);
    background-size: 400% 100%; border-radius: var(--radius-sm); animation: shimmer 1.4s ease infinite;
  }
  @media (prefers-reduced-motion: reduce) { .skeleton { animation: none; background: var(--surface-sunken); } }
  @keyframes shimmer { 0% { background-position: 100% 0; } 100% { background-position: 0 0; } }

  /* ---- Today: two-column layout -------------------------------------------- */
  .today-grid { display: grid; grid-template-columns: 1fr 340px; gap: var(--space-10); align-items: start; }
  .side-panel { display: flex; flex-direction: column; gap: var(--space-8); }
  .agenda-list { display: flex; flex-direction: column; }
  .agenda-item { display: flex; align-items: center; gap: var(--space-4); padding: var(--space-4) 0; border-bottom: 1px solid var(--border-hairline); }
  .agenda-item:last-child { border-bottom: none; padding-bottom: 0; }
  .agenda-item:first-child { padding-top: 0; }
  .agenda-day { width: 40px; text-align: center; flex-shrink: 0; }
  .agenda-day-label { font-size: var(--fs-micro); color: var(--text-tertiary); font-weight: var(--fw-bold); text-transform: uppercase; }
  .agenda-day-num { font-size: var(--fs-sm); font-weight: var(--fw-bold); }
  .agenda-body { flex: 1; min-width: 0; }
  .agenda-title { font-size: var(--fs-sm); font-weight: var(--fw-semibold); }
  .agenda-sub { font-size: var(--fs-micro); color: var(--text-tertiary); margin-top: 1px; }
  .agenda-amount { font-size: var(--fs-sm); font-weight: var(--fw-bold); white-space: nowrap; }

  .mini-alloc { display: flex; align-items: center; gap: var(--space-7); cursor: pointer; border-radius: var(--radius-lg); padding: var(--space-2); margin: calc(var(--space-2) * -1); transition: background var(--dur-fast); }
  .mini-alloc:hover { background: var(--surface-sunken); }
  .mini-alloc-legend { display: flex; flex-direction: column; gap: 7px; flex: 1; min-width: 0; }
  .mini-alloc-item { display: flex; align-items: center; gap: 8px; font-size: var(--fs-meta); }
  .mini-alloc-dot { width: 9px; height: 9px; border-radius: var(--radius-pill); flex-shrink: 0; }
  .mini-alloc-name { color: var(--text-secondary); flex: 1; }
  .mini-alloc-pct { font-weight: var(--fw-bold); color: var(--text-primary); }

  /* ---- Portfolio screen (v4 — dual hero + sectioned insight column) --------- */
  .hero-toggle { display: flex; align-items: baseline; gap: var(--space-3); margin-top: var(--space-2); cursor: pointer; user-select: none; flex-wrap: wrap; }
  .hero-toggle-value { font-family: var(--font-mono); font-weight: var(--fw-bold); font-size: var(--fs-heading); }
  .hero-toggle-value.dim { color: var(--text-tertiary); }
  .hero-toggle-value.down { color: var(--color-loss); }
  .hero-toggle-label { font-size: var(--fs-micro); color: var(--text-tertiary); }
  .hero-toggle-swap { color: var(--text-tertiary); }
  .hero-toggle-note { font-size: var(--fs-micro); color: var(--text-tertiary); margin-top: var(--space-2); line-height: 1.5; }

  .portfolio-hero-row { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-8); margin-bottom: var(--space-8); }
  .goal-hero-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--space-6); margin-bottom: var(--space-8); }
  .hero-card-label { font-size: var(--fs-label); font-weight: var(--fw-bold); letter-spacing: var(--ls-label); text-transform: uppercase; color: var(--text-tertiary); margin-bottom: var(--space-2); }
  .hero-card-value { font-family: var(--font-mono); font-size: 28px; font-weight: var(--fw-bold); letter-spacing: var(--ls-display); line-height: 1.1; }

  .inline-link { color: var(--accent); cursor: pointer; font-weight: var(--fw-bold); }
  .inline-link:hover { text-decoration: underline; }

  .class-btn-row { display: flex; align-items: center; gap: var(--space-3); flex-wrap: wrap; margin-bottom: var(--space-5); }
  .class-btn {
    padding: var(--space-3) var(--space-5); border-radius: var(--radius-md); border: 1px solid var(--border-strong);
    background: var(--surface-card); font-family: var(--font-sans); font-size: var(--fs-meta); font-weight: var(--fw-bold);
    color: var(--text-secondary); cursor: pointer; transition: all var(--dur-fast); white-space: nowrap;
  }
  .class-btn .cnt { color: var(--text-tertiary); font-weight: var(--fw-medium); margin-left: 4px; }
  .class-btn.active { background: var(--ink-900); color: var(--white); border-color: var(--ink-900); }
  .class-btn.active .cnt { color: color-mix(in srgb, var(--white) 60%, transparent); }
  .filter-right { margin-left: auto; display: flex; align-items: center; gap: var(--space-4); }
  .filter-select {
    padding: var(--space-3) var(--space-5); border-radius: var(--radius-md); border: 1px solid var(--border-strong);
    background: var(--surface-card); font-family: var(--font-sans); font-size: var(--fs-meta); font-weight: var(--fw-semibold);
    color: var(--text-primary); cursor: pointer;
  }

  .table-wrap { background: var(--surface-card); border: 1px solid var(--border-hairline); border-radius: var(--radius-xl); box-shadow: var(--shadow-card); overflow: hidden; }
  .holdings-table { width: 100%; border-collapse: collapse; }
  .holdings-table th {
    text-align: left; font-size: 10px; font-weight: var(--fw-bold); letter-spacing: var(--ls-label); text-transform: uppercase;
    color: var(--text-tertiary); padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--border-strong);
    cursor: pointer; user-select: none; white-space: nowrap;
  }
  .holdings-table th:hover { color: var(--text-primary); }
  .holdings-table th.num, .holdings-table td.num { text-align: right; }
  .holdings-table td { padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--border-hairline); font-size: 13px; }
  .holdings-table tbody tr:last-child td { border-bottom: none; }
  .holdings-table tr.group-row td { background: var(--surface-sunken); font-weight: var(--fw-bold); font-size: var(--fs-micro); text-transform: uppercase; letter-spacing: var(--ls-label); color: var(--text-secondary); padding-top: var(--space-3); padding-bottom: var(--space-3); }
  .holdings-table tbody tr.data-row { cursor: pointer; }
  .holdings-table tbody tr.data-row:hover td { background: color-mix(in srgb, var(--accent) 5%, transparent); }
  .holdings-table tbody tr.data-row.selected td { background: var(--accent-wash); }
  .holding-name-cell { font-weight: var(--fw-semibold); }
  .holding-sub-cell { font-size: 11px; color: var(--text-tertiary); margin-top: 1px; }
  .gain-cell.up { color: var(--color-gain); font-weight: var(--fw-bold); }
  .gain-cell.down { color: var(--color-loss); font-weight: var(--fw-bold); }
  .gain-cell.flat { color: var(--text-tertiary); }
  .sort-arrow { color: var(--accent); margin-left: 3px; }
  .pending-note { font-size: var(--fs-micro); color: var(--text-tertiary); margin-top: var(--space-4); }

  /* ---- Insights/Money screens: masonry column layout, class-aware ----------
     A CSS grid forces every card in a row to match the tallest one, which left
     large dead gaps when a short stat card sat next to a long list. Multi-column
     flow lets each card size to its own content instead. */
  .insights-col { columns: 2 440px; column-gap: var(--space-6); margin-top: var(--space-8); }
  .insights-col > * { break-inside: avoid; margin-bottom: var(--space-6); }
  .insights-col > .span-2 { column-span: all; }
  .insight-section-title { font-size: var(--fs-label); font-weight: var(--fw-bold); letter-spacing: var(--ls-label); text-transform: uppercase; color: var(--text-tertiary); margin-bottom: var(--space-3); display: flex; align-items: center; gap: var(--space-2); }
  .insight-section-body { display: flex; flex-direction: column; gap: var(--space-3); }

  .range-scan-row { display: flex; align-items: center; gap: var(--space-3); margin-bottom: var(--space-3); font-size: 12.5px; }
  .range-scan-label { width: 150px; flex-shrink: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-secondary); }
  .range-scan-track { flex: 1; height: 6px; border-radius: var(--radius-pill); background: var(--surface-sunken); position: relative; }
  .range-scan-dot { position: absolute; top: 50%; width: 10px; height: 10px; border-radius: var(--radius-pill); background: var(--accent); transform: translate(-50%, -50%); }
  .range-scan-pct { width: 36px; text-align: right; color: var(--text-tertiary); flex-shrink: 0; }

  .rank-list { display: flex; flex-direction: column; gap: 0; }
  .rank-row { display: flex; justify-content: space-between; align-items: center; gap: var(--space-3); font-size: 12.5px; padding: 7px 0; border-bottom: 1px solid var(--border-hairline); }
  .rank-row:last-child { border-bottom: none; }
  .rank-name { color: var(--text-secondary); }
  .rank-gain { font-weight: var(--fw-bold); font-family: var(--font-mono); flex-shrink: 0; }
  .rank-gain.up { color: var(--color-gain); } .rank-gain.down { color: var(--color-loss); }

  .maturity-row { margin-bottom: var(--space-5); }
  .maturity-row:last-child { margin-bottom: 0; }
  .maturity-head { display: flex; justify-content: space-between; font-size: 12.5px; margin-bottom: 4px; }
  .maturity-track { height: 8px; border-radius: var(--radius-pill); background: var(--surface-sunken); overflow: hidden; }
  .maturity-fill { height: 100%; border-radius: var(--radius-pill); background: var(--sage-500); }
  .maturity-date { font-size: 11px; color: var(--text-tertiary); margin-top: 3px; }

  .class-compare-row { display: flex; align-items: center; gap: var(--space-3); margin-bottom: var(--space-3); }
  .class-compare-label { width: 120px; flex-shrink: 0; font-size: 12.5px; color: var(--text-secondary); }
  .class-compare-track { flex: 1; height: 8px; border-radius: var(--radius-pill); background: var(--surface-sunken); overflow: hidden; }
  .class-compare-fill { height: 100%; border-radius: var(--radius-pill); }
  .class-compare-gain { width: 56px; text-align: right; font-size: 12px; font-family: var(--font-mono); flex-shrink: 0; }

// ============================================================
// 07  Formatters — currency, %, dates, locale
// ============================================================
function formatINR(amount, { compact = true } = {}) {
  const abs = Math.abs(amount);
  const sign = amount < 0 ? '-' : '';
  if (compact && abs >= 1e7) return `${sign}₹${(abs / 1e7).toFixed(2)} Cr`;
  if (compact && abs >= 1e5) return `${sign}₹${(abs / 1e5).toFixed(2)} L`;
  return `${sign}₹${Math.round(abs).toLocaleString('en-IN')}`;
}
function formatFullINR(amount) { return `₹${Math.round(amount).toLocaleString('en-IN')}`; }
function formatPct(x, digits = 1) { const sign = x > 0 ? '+' : ''; return `${sign}${(x * 100).toFixed(digits)}%`; }
function formatNum(x, digits = 2) { if (x == null) return '—'; return x.toLocaleString('en-IN', { minimumFractionDigits: digits, maximumFractionDigits: digits }); }
function formatMoney(amount, currency) { return currency === 'USD' ? `$${formatNum(amount, 2)}` : formatINR(amount); }
const DAY_LABELS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const SEVERITY_TONE = { Critical: 'critical', High: 'high', Medium: 'medium', Watch: 'watch' };
function toLocalISO(d) {
  const y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, '0'), day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}
function seededRandom(seed) {
  let s = seed;
  return () => { s = (s * 1103515245 + 12345) & 0x7fffffff; return s / 0x7fffffff; };
}

// ============================================================
// 08a  Icon — Miso's 38-glyph hand-drawn line set, plus Mina-specific

// ============================================================
function Icon({ name, size = 16, style = {} }) {

  const wrap = { display: 'inline-flex', alignItems: 'center', justifyContent: 'center', width: size, height: size, flexShrink: 0, ...style };

  if (name === 'home') return svg(html`<path d="M4 11L12 4l8 7" /><path d="M6 10v9a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-9" /><path d="M10 20v-5h4v5" />`);
  if (name === 'chart') return svg(html`<circle cx="12" cy="12" r="8" /><line x1="12" y1="12" x2="12" y2="4" /><line x1="12" y1="12" x2="18.2" y2="15.8" /><line x1="12" y1="12" x2="6.2" y2="16" />`);
  if (name === 'bulb') return svg(html`<path d="M9 18h6" /><path d="M10 21h4" /><path d="M12 3a6 6 0 0 0-4 10.4c1 .9 1.5 1.9 1.5 2.6h5c0-.7.5-1.7 1.5-2.6A6 6 0 0 0 12 3z" />`);
  if (name === 'wallet') return svg(html`<path d="M3 8a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8z" /><path d="M16.5 12h3.5v4h-3.5a2 2 0 0 1 0-4z" />`);
  if (name === 'flag') return svg(html`<path d="M12 3l9 16H3L12 3z" /><line x1="12" y1="9.5" x2="12" y2="14" /><circle cx="12" cy="16.8" r="0.9" fill="currentColor" stroke="none" />`);
  if (name === 'newspaper') return svg(html`<path d="M4 4h13a2 2 0 0 1 2 2v13a1 1 0 0 1-1 1H6a2 2 0 0 1-2-2V4z" /><path d="M19 8h1a1 1 0 0 1 1 1v9a2 2 0 0 1-2 2" /><line x1="7" y1="8" x2="14" y2="8" /><line x1="7" y1="11" x2="14" y2="11" /><line x1="7" y1="14" x2="11" y2="14" />`);
  if (name === 'calendar' || name === 'menuTab') return svg(html`<rect x="3" y="4" width="18" height="18" rx="2" /><line x1="16" y1="2" x2="16" y2="6" /><line x1="8" y1="2" x2="8" y2="6" /><line x1="3" y1="10" x2="21" y2="10" />`);
  if (name === 'inbox') return svg(html`<path d="M3 12h5l2 3h4l2-3h5" /><path d="M5 5h14l2 7v7a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-7l2-7z" />`);
  if (name === 'gear') return svg(html`<circle cx="12" cy="12" r="3.2" /><path d="M12 2.5v2.6M12 18.9v2.6M21.5 12h-2.6M5.1 12H2.5M18.6 5.4l-1.85 1.85M7.25 16.75L5.4 18.6M18.6 18.6l-1.85-1.85M7.25 7.25L5.4 5.4" />`);
  if (name === 'plus') return svg(html`<line x1="12" y1="5" x2="12" y2="19" /><line x1="5" y1="12" x2="19" y2="12" />`);
  if (name === 'chevronDown') return svg(html`<polyline points="6,9 12,15 18,9" />`);
  if (name === 'sparkle') return svg(html`<path d="M12 3v4M12 17v4M3 12h4M17 12h4M5.5 5.5l2.5 2.5M16 16l2.5 2.5M18.5 5.5L16 8M8 16l-2.5 2.5" />`);
  if (name === 'link') return svg(html`<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" /><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" />`);
  if (name === 'trendUp') return svg(html`<polyline points="3,17 9,11 13,15 21,6" /><polyline points="15,6 21,6 21,12" />`);
  return null;
}

// ============================================================
// 08b  Shared UI — Card, Badge, Sparkline, EmptyState, Skeleton, Donut
// ============================================================
function Card({ children }) { return html`<div class="card">${children}</div>`; }
function SeverityBadge({ severity }) { return html`<span class="badge tone-${SEVERITY_TONE[severity] || 'watch'}">${severity}</span>`; }
function EmptyState({ icon, title, body }) {
  return html`<div class="empty-state"><div class="empty-state-icon"><${Icon} name=${icon} size=${32} /></div><div class="empty-state-title">${title}</div><div>${body}</div></div>`;
}
function Skeleton({ width = '100%', height = '16px' }) { return html`<div class="skeleton" style=${{ width, height }} />`; }

function Sparkline({ data }) {
  const reducedMotion = useMemo(() => window.matchMedia('(prefers-reduced-motion: reduce)').matches, []);
  const w = 600, h = 90, pad = 4;
  const values = data.map(d => d.value);
  const min = Math.min(...values), max = Math.max(...values);
  const range = max - min || 1;
  const points = data.map((d, i) => {
    const x = (i / (data.length - 1)) * (w - pad * 2) + pad;
    const y = h - pad - ((d.value - min) / range) * (h - pad * 2);
    return [x, y];
  });
  const linePath = points.map((p, i) => `${i === 0 ? 'M' : 'L'}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');
  const fillPath = `${linePath} L${points[points.length - 1][0]},${h} L${points[0][0]},${h} Z`;
  const approxLen = points.reduce((acc, p, i) => i === 0 ? 0 : acc + Math.hypot(p[0] - points[i - 1][0], p[1] - points[i - 1][1]), 0);
  return html`
    <div class="sparkline-wrap">
      <svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none">
        <path class="sparkline-path sparkline-fill" d=${fillPath} fill="var(--accent)" stroke="none" />
        <path class="sparkline-path ${reducedMotion ? '' : 'animate'}" style=${{ '--dash-len': approxLen }} d=${linePath} />
      </svg>
      <div style="display:flex;justify-content:space-between;font-size:var(--fs-micro);color:var(--text-tertiary);margin-top:4px;">
        <span>${data[0].date}</span><span>90 days</span><span>${data[data.length - 1].date}</span>
      </div>
    </div>
  `;
}

function Donut({ groups, size = 104, strokeW = 18 }) {
  const r = (size - strokeW) / 2;
  const c = 2 * Math.PI * r;
  let offset = 0;
  const segs = groups.map(g => {
    const len = Math.max(g.weight * c, g.weight > 0 ? 1.5 : 0);
    const seg = { key: g.key, color: g.color, dash: `${len} ${c - len}`, dashoffset: -offset };
    offset += len;
    return seg;
  });
  return html`
    <svg width=${size} height=${size} viewBox="0 0 ${size} ${size}">
      <g transform="rotate(-90 ${size / 2} ${size / 2})">
        <circle cx=${size / 2} cy=${size / 2} r=${r} fill="none" stroke="var(--surface-sunken)" stroke-width=${strokeW} />
        ${segs.map(s => html`<circle key=${s.key} cx=${size / 2} cy=${size / 2} r=${r} fill="none" stroke="var(--${s.color}-500)" stroke-width=${strokeW} stroke-dasharray=${s.dash} stroke-dashoffset=${s.dashoffset} stroke-linecap="butt" />`)}
      </g>
    </svg>
  `;
}

// Dual-line indexed-to-100 comparison chart — "own trend" vs a real benchmark.
// Both lines are plotted by fractional position (i/(n-1)) so series of different
// lengths/timescales still share one 0..1 x-axis; only the % change is compared,
// not absolute value, which is the standard way to compare mismatched series.
function TrendChart({ series, benchSeries, seriesColor = 'var(--accent)', benchColor = 'var(--lilac-500)' }) {
  const w = 720, h = 200, pad = 8;
  function rebase(pts) {
    const base = pts[0].value;
    return pts.map((p, i) => ({ x: i / (pts.length - 1), y: (p.value / base) * 100 }));
  }
  const a = rebase(series);
  const b = benchSeries ? rebase(benchSeries) : null;
  const all = b ? [...a, ...b] : a;
  const min = Math.min(...all.map(p => p.y)), max = Math.max(...all.map(p => p.y));
  const range = (max - min) || 1;
  function toPath(pts) {
    return pts.map((p, i) => {
      const x = p.x * (w - pad * 2) + pad;
      const y = h - pad - ((p.y - min) / range) * (h - pad * 2);
      return `${i === 0 ? 'M' : 'L'}${x.toFixed(1)},${y.toFixed(1)}`;
    }).join(' ');
  }
  return html`
    <svg viewBox="0 0 ${w} ${h}" width="100%" height=${h} preserveAspectRatio="none">
      <line x1=${pad} y1=${h - pad - ((100 - min) / range) * (h - pad * 2)} x2=${w - pad} y2=${h - pad - ((100 - min) / range) * (h - pad * 2)} stroke="var(--border-hairline)" stroke-dasharray="3 3" />
      ${b ? html`<path d=${toPath(b)} fill="none" stroke=${benchColor} stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />` : ''}
      <path d=${toPath(a)} fill="none" stroke=${seriesColor} stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
  `;
}

// ============================================================
// 09  Asset-class buckets & grouping — shared by Today's mini strip and Portfolio
// ============================================================
const LENS_PALETTE = ['sage', 'amber', 'terracotta', 'lilac', 'teal'];

const L1_LENS = { id: 'class', keyFn: p => instruments[p.instrument_id]?.l1 || 'Other' };

function groupByL1(positionList) {
  const total = positionList.reduce((s, p) => s + p.current_value, 0);
  const groups = new Map();
  positionList.forEach(p => {
    const key = L1_LENS.keyFn(p);
    if (!groups.has(key)) groups.set(key, { key, value: 0, positions: [] });
    const g = groups.get(key);
    g.value += p.current_value; g.positions.push(p);
  });
  const sorted = [...groups.values()].sort((a, b) => b.value - a.value);
  sorted.forEach((g, i) => { g.color = LENS_PALETTE[i % LENS_PALETTE.length]; g.weight = total ? g.value / total : 0; });
  return { groups: sorted, total };
}

const CLASS_BUCKETS = [
  { id: 'all', label: 'All' },
  { id: 'mf', label: 'Mutual Funds', l3s: ['Index fund', 'Active MF', 'Liquid fund'] },
  { id: 'indian_equity', label: 'Indian Equity', l3s: ['Domestic stock'] },
  { id: 'foreign_equity', label: 'Foreign Equity', l3s: ['Foreign stock', 'ESOP/RSU/SAR'] },
  { id: 'epf', label: 'EPF', l3s: ['EPF'] },
  { id: 'fixed_income', label: 'Fixed Income', l3s: ['FD'] },
  { id: 'real_assets', label: 'Real Assets', l3s: ['Gold ETF'] },
];
function classOf(p) {
  const l3 = instruments[p.instrument_id]?.l3;
  const bucket = CLASS_BUCKETS.find(c => c.l3s && c.l3s.includes(l3));
  return bucket ? bucket.id : 'all';
}
function classLabel(id) { return CLASS_BUCKETS.find(c => c.id === id)?.label || id; }

const ALL_PRICED = positions.filter(p => p.current_value != null);

function impliedCostBasis(p) {
  if (p.cost_basis != null) return p.cost_basis;
  if (p.cost_basis_usd != null) return p.cost_basis_usd * PRICE_ASOF.usd_inr;
  return p.current_value * 0.85; // RSU-style fallback — no cost basis on file at all
}
function currencyMajority(positionList) {
  const inr = positionList.filter(p => instruments[p.instrument_id]?.currency !== 'USD').reduce((s, p) => s + p.current_value, 0);
  const usd = positionList.reduce((s, p) => s + p.current_value, 0) - inr;
  return usd > inr ? 'USD' : 'INR';
}
function buildIllustrativeTrend(startValue, endValue, days = 90, seed = 7) {
  const rand = seededRandom(seed);
  const today = new Date('2026-08-02T00:00:00');
  let value = startValue;
  const series = [];
  for (let i = days - 1; i >= 0; i--) {
    const d = new Date(today); d.setDate(d.getDate() - i);
    const noise = (rand() - 0.5) * 0.01;
    const trendStep = (endValue - value) / (i + 1);
    value = value + trendStep + value * noise;
    series.push({ date: toLocalISO(d), value: Math.round(value) });
  }
  series[series.length - 1].value = Math.round(endValue);
  return series;
}

// ============================================================
// 10  Screen: Today
// ============================================================
function whatChangedCards() {
  const cards = [];
  if (flags.length) {
    const f = flags[0];
    const inst = instruments[positions.find(p => p.id === f.affected_positions[0])?.instrument_id];
    cards.push({ icon: 'flag', title: `${inst?.name.split(' ').slice(0, 3).join(' ')} · ${f.category.toLowerCase()}`, sub: f.signal, trailing: formatINR(f.exposure_amount), severity: f.severity, key: 'flag' });

  }
  return cards.slice(0, 3);
}

// ---- Scope-aware insight generation ---------------------------------------
function technicalInsight(p) {
  const inst = instruments[p.instrument_id];
  if (!inst?.tech) return null;
  const { week52High, week52Low, dayHigh, dayLow, volume } = inst.tech;
  const posInRange = (p.nav - week52Low) / (week52High - week52Low);
  let read;
  if (posInRange > 0.92) read = 'trading right at its 52-week high — momentum is strong, but so is the risk of chasing a top.';
  else if (posInRange < 0.15) read = 'trading near its 52-week low — either a real value opportunity or a reason the market has soured on it. Worth checking why before buying more.';
  else if (posInRange > 0.7) read = `trading in the upper part of its 52-week range (${(posInRange * 100).toFixed(0)}% of the way from low to high).`;
  else read = `sitting mid-range for the year (${(posInRange * 100).toFixed(0)}% of the way from its 52-week low to high) — no strong technical signal either way.`;
  return {
    id: 'technical', icon: 'trendUp', tag: 'Technical', title: `52-week range: ${formatMoney(week52Low, inst.currency)} – ${formatMoney(week52High, inst.currency)}`,
    body: `At ${formatMoney(p.nav, inst.currency)}, ${inst.name.split(' ').slice(0, 3).join(' ')} is ${read} Day range ${formatMoney(dayLow, inst.currency)}–${formatMoney(dayHigh, inst.currency)}, volume ${volume.toLocaleString('en-IN')}. <span style="opacity:0.7">Source: Yahoo Finance, ${inst.tech.asof.split('(')[0].trim()}.</span>`,
  };
}
function peerComparisonInsight(p, peers) {
  const gp = gainPctOf(p);
  if (gp == null || peers.length < 2) return null;
  const withGain = peers.filter(x => gainPctOf(x) != null && x.id !== p.id);
  if (!withGain.length) return null;
  const avg = withGain.reduce((s, x) => s + gainPctOf(x), 0) / withGain.length;
  const diff = (gp - avg) * 100;
  const inst = instruments[p.instrument_id];
  if (diff < -12) {
    return { id: 'underperform', icon: 'flag', tone: 'high', tag: 'Performance', title: 'Underperforming its own peer set', body: `${inst.name.split(' ').slice(0, 4).join(' ')} is returning <b>${formatPct(gp)}</b>, vs an average of <b>${formatPct(avg)}</b> across the other holdings in the same bucket — <b>${Math.abs(diff).toFixed(0)} points behind</b>. Worth a fresh look at whether it still earns its place.` };
  }
  if (diff > 25) {
    return { id: 'outperform', icon: 'trendUp', tag: 'Performance', title: 'A standout performer in its bucket', body: `${inst.name.split(' ').slice(0, 4).join(' ')} is returning <b>${formatPct(gp)}</b>, well ahead of the <b>${formatPct(avg)}</b> average of its peers. Worth checking it hasn't grown into an oversized position by success alone.` };
  }
  return null;
}
function concentrationInsight(p, scopeTotal) {
  const w = p.current_value / householdTotals.current_total;
  if (w < 0.08) return null;
  const inst = instruments[p.instrument_id];
  return { id: 'weight', icon: 'flag', tone: w > 0.15 ? 'high' : 'medium', tag: 'Concentration', title: `${(w * 100).toFixed(1)}% of household net worth in one line`, body: `${inst.name.split(' ').slice(0, 4).join(' ')} alone is <b>${formatINR(p.current_value)}</b>. A single holding above 10–15% of net worth is a concentration most advisors would flag regardless of how good the story is.` };
}
function sectorConcentrationInsight(scopePositions) {
  const bySector = new Map();
  let total = 0;
  scopePositions.forEach(p => {
    const sector = instruments[p.instrument_id]?.sector;
    if (!sector) return;
    bySector.set(sector, (bySector.get(sector) || 0) + p.current_value);
    total += p.current_value;
  });
  if (!total) return null;
  const top = [...bySector.entries()].sort((a, b) => b[1] - a[1])[0];
  if (!top || top[1] / total < 0.28) return null;
  return { id: 'sector-conc', icon: 'flag', tone: 'medium', tag: 'Concentration', title: `${(top[1] / total * 100).toFixed(0)}% of this view is one sector`, body: `<b>${top[0]}</b> accounts for ${formatINR(top[1])} of the ${formatINR(total)} shown here. Worth knowing the sector bet, not just the stock count.` };
}

function computeScope(classId, memberId, selectedId) {
  const filtered = ALL_PRICED.filter(p => {
    if (classId !== 'all' && classOf(p) !== classId) return false;
    if (memberId !== 'all' && accounts[p.account_id]?.member_id !== memberId) return false;
    return true;
  });
  const selected = selectedId ? positions.find(p => p.id === selectedId) : null;
  const scopePositions = selected ? [selected] : filtered;
  const scopeTotal = scopePositions.reduce((s, p) => s + p.current_value, 0);
  const costTotal = scopePositions.reduce((s, p) => s + impliedCostBasis(p), 0);
  const aggReturn = costTotal ? (scopeTotal - costTotal) / costTotal : null;

  let label;
  if (selected) label = instruments[selected.instrument_id]?.name;
  else if (classId !== 'all' && memberId !== 'all') label = `${classLabel(classId)} · ${members[memberId].name}`;
  else if (classId !== 'all') label = classLabel(classId);
  else if (memberId !== 'all') label = members[memberId].name;
  else label = 'Entire portfolio';

  return { filtered, selected, scopePositions, scopeTotal, aggReturn, label, classId, memberId };
}

function trendForScope(scope) {
  // EPF gets its REAL yearly history — the one asset with genuine long-run data.
  if (scope.scopePositions.length === 1 && scope.scopePositions[0].instrument_id === 'inst_epf_vinod') {
    const series = epfHistoryVinod.map(y => ({ date: y.fy_end.slice(0, 7), value: y.total }));
    const years = epfHistoryVinod.length - 1;
    const cagr = years > 0 ? Math.pow(series[series.length - 1].value / series[0].value, 1 / years) - 1 : null;
    return { series, benchSeries: null, isReal: true, ownReturnLabel: 'CAGR since 2018 (real, EPFO passbook)', ownReturn: cagr, benchmark: null };
  }
  const start = scope.scopePositions.reduce((s, p) => s + impliedCostBasis(p), 0);
  const end = scope.scopeTotal;
  const series = buildIllustrativeTrend(start || end * 0.85, end, 90, scope.label.length + scope.scopeTotal);
  const currency = currencyMajority(scope.scopePositions);
  const bench = currency === 'USD' ? BENCHMARKS.nasdaq : BENCHMARKS.nifty50;
  const benchSeries = bench.series.map(([date, value]) => ({ date, value }));
  return { series, benchSeries, isReal: false, ownReturnLabel: 'Aggregate unrealised return', ownReturn: scope.aggReturn, benchmark: bench };
}

// Same-representation return metrics for the two hero cards. Real numbers where
// we have them (EPF CAGR, FD contracted rate, household's disclosed-synthetic
// XIRR/TWR); everywhere else, real unrealised return vs. a real benchmark —
// never a fabricated per-scope XIRR, since that needs cash-flow-dated lots we
// don't have (see the known-gaps note in CLAUDE.md).
function scopeReturnMetrics(scope) {
  if (scope.scopePositions.length === 1 && scope.scopePositions[0].instrument_id === 'inst_epf_vinod') {
    const years = epfHistoryVinod.length - 1;
    const cagr = years > 0 ? Math.pow(epfHistoryVinod[epfHistoryVinod.length - 1].total / epfHistoryVinod[0].total, 1 / years) - 1 : null;
    return { primary: { label: 'CAGR', value: cagr }, secondary: null, note: 'Real CAGR since 2018 (EPFO passbook). EPF has no XIRR/TWR in the usual sense — contributions are payroll-linked, not discretionary.' };
  }
  const posList = scope.scopePositions;
  if (posList.length && posList.every(p => instruments[p.instrument_id]?.l3 === 'FD')) {
    const totalV = posList.reduce((s, p) => s + p.current_value, 0);
    const wRate = totalV ? posList.reduce((s, p) => s + (instruments[p.instrument_id].rate || 0) * p.current_value, 0) / totalV : null;
    return { primary: { label: 'Contracted rate', value: wRate }, secondary: null, note: 'Real, bank-contracted interest rate — fixed deposits earn a guaranteed rate, not a market-driven XIRR/TWR.' };
  }
  if (!scope.selected && scope.classId === 'all' && scope.memberId === 'all') {
    return { primary: { label: 'XIRR', value: householdTotals.xirr }, secondary: { label: 'TWR', value: householdTotals.twr }, note: 'Household total. What you personally earned, including timing.' };
  }
  const currency = currencyMajority(posList);
  const bench = currency === 'USD' ? BENCHMARKS.nasdaq : BENCHMARKS.nifty50;
  return { primary: { label: 'Total return', value: scope.aggReturn }, secondary: { label: `${bench.label} · 3mo`, value: bench.return3mo }, note: 'True per-lot XIRR/TWR need cash-flow-dated lot history — not available below the household total yet (Stage 8). Shown here: real unrealised return vs. a market benchmark.' };
}

function computeScopedInsights(scope) {
  const out = [];
  if (scope.selected) {
    const p = scope.selected;
    const tech = technicalInsight(p);
    if (tech) out.push(tech);
    const classPeers = ALL_PRICED.filter(x => classOf(x) === classOf(p));
    const peerCmp = peerComparisonInsight(p, classPeers);
    if (peerCmp) out.push(peerCmp);
    const conc = concentrationInsight(p, scope.scopeTotal);
    if (conc) out.push(conc);
    (SPECIAL_BY_INSTRUMENT[p.instrument_id] || []).forEach(fn => { const r = fn(); if (r && !out.some(o => o.id === r.id)) out.push(r); });
    if (!out.length) out.push({ id: 'none', icon: 'sparkle', tag: 'Info', title: 'Nothing unusual detected', body: 'No concentration, cost, or technical flags for this specific holding right now.' });
    return out;
  }
  // Class/member/portfolio-level: fixed relevant set + dynamic peer-underperformer + sector concentration
  (CLASS_RELEVANT[scope.classId] || []).forEach(fn => { const r = fn(); if (r) out.push(r); });
  if (scope.classId === 'indian_equity' || scope.classId === 'all') {
    const sectorIns = sectorConcentrationInsight(scope.filtered.filter(p => classOf(p) === 'indian_equity' || scope.classId === 'indian_equity'));
    if (sectorIns) out.push(sectorIns);
  }
  if (scope.filtered.length > 1) {
    const withGain = scope.filtered.filter(p => gainPctOf(p) != null);
    if (withGain.length > 2) {
      const avg = withGain.reduce((s, p) => s + gainPctOf(p), 0) / withGain.length;
      const worst = withGain.reduce((a, b) => gainPctOf(a) < gainPctOf(b) ? a : b);
      if ((gainPctOf(worst) - avg) * 100 < -15) {
        const inst = instruments[worst.instrument_id];

      }
    }
  }
  if (!out.length) out.push({ id: 'none', icon: 'sparkle', tag: 'Info', title: 'No standout flags for this view', body: 'Try selecting a specific holding for a technical + fundamental deep-dive, or switch to "All" for the household-wide picture.' });

}

// ---- Mutual Fund composition / overlap — real, name+ISIN-based heuristics ----
function fundCategoryOf(inst) {
  const n = inst.name.toLowerCase();
  if (n.includes('elss')) return 'ELSS';
  if (n.includes('liquid')) return 'Liquid';
  if (n.includes('small cap')) return 'Smallcap';
  if (n.includes('midcap') || n.includes('mid cap')) return 'Midcap';
  if (n.includes('flexi cap') || n.includes('flexicap')) return 'Flexicap';
  if (n.includes('index') || n.includes('sensex') || n.includes('next 50') || n.includes('next50')) return 'Index';
  return 'Active — diversified';
}
const FUND_CATEGORY_COLOR = { ELSS: 'terracotta', Liquid: 'teal', Smallcap: 'danger', Midcap: 'amber', Flexicap: 'lilac', Index: 'sage', 'Active — diversified': 'bronze' };

function mfCompositionData(mfPositions) {
  const total = mfPositions.reduce((s, p) => s + p.current_value, 0);
  const byCat = new Map();
  mfPositions.forEach(p => { const cat = fundCategoryOf(instruments[p.instrument_id]); byCat.set(cat, (byCat.get(cat) || 0) + p.current_value); });
  const bars = [...byCat.entries()].sort((a, b) => b[1] - a[1]).map(([label, value]) => ({ label, value, pct: total ? value / total : 0, color: FUND_CATEGORY_COLOR[label] || 'bronze' }));

  const overlaps = [];
  const byIsin = new Map();
  mfPositions.forEach(p => { const isin = instruments[p.instrument_id]?.isin; if (!isin) return; if (!byIsin.has(isin)) byIsin.set(isin, []); byIsin.get(isin).push(p); });
  byIsin.forEach(list => {
    if (list.length > 1) {
      const inst = instruments[list[0].instrument_id];
      const v = list.reduce((s, p) => s + p.current_value, 0);
      overlaps.push(`<b>${inst.name}</b> is held ${list.length}× across the household (${formatINR(v)} combined, identical ISIN) — literally the same fund in more than one folio.`);
    }
  });
  const flexiByIsin = new Map();
  mfPositions.filter(p => fundCategoryOf(instruments[p.instrument_id]) === 'Flexicap').forEach(p => { const inst = instruments[p.instrument_id]; flexiByIsin.set(inst.isin, inst.name); });
  if (flexiByIsin.size > 1) overlaps.push(`<b>${flexiByIsin.size} different Flexicap funds</b> held (${[...flexiByIsin.values()].map(n => n.split(' ').slice(0, 2).join(' ')).join(' + ')}) — meaningfully overlapping mandates; worth checking if one is doing the job of two.`);

  const smallMid = mfPositions.filter(p => ['Smallcap', 'Midcap'].includes(fundCategoryOf(instruments[p.instrument_id])));
  const smallMidPct = total ? smallMid.reduce((s, p) => s + p.current_value, 0) / total : 0;
  return { bars, overlaps, smallMid, smallMidPct, total };
}
function mfRebalancingBullets(mfPositions, comp) {
  const out = [];
  if (comp.smallMid.length >= 3) {
    const names = comp.smallMid.map(p => instruments[p.instrument_id].name.split(' ').slice(0, 3).join(' ')).join(', ');
    out.push(`<b>${comp.smallMid.length} separate small/midcap-tilted funds</b> (${names}) worth <b>${(comp.smallMidPct * 100).toFixed(0)}%</b> of this MF view — even style-diversified, that many funds chasing similar-cap exposure usually duplicates more than it diversifies.`);
  } else if (comp.smallMidPct > 0.32) {
    out.push(`Small/midcap-tilted funds are <b>${(comp.smallMidPct * 100).toFixed(0)}%</b> of this MF view — above a typical 15–25% satellite allocation, so a broad-market drawdown would hit this sleeve harder than the rest.`);
  }
  const indexPct = comp.bars.find(b => b.label === 'Index')?.pct || 0;
  if (indexPct < 0.15) out.push(`Only <b>${(indexPct * 100).toFixed(0)}%</b> of this MF view is in a low-cost index fund — the rest is actively managed, which is a recurring fee and manager-selection bet, not a passive core.`);
  if (comp.overlaps.length) out.push(`<b>${comp.overlaps.length} concrete overlap${comp.overlaps.length > 1 ? 's' : ''}</b> detected in Composition above — consolidating would simplify tracking without materially changing exposure.`);
  return out;
}

// Illustrative growth reconstruction anchored to REAL invested/value totals, plus a
// projection extrapolating a real benchmark's trailing return — see the card's own
// disclosure text. Never presented as fact; every number traces to a real endpoint
// or a disclosed, formula-based assumption (AI boundaries — no ungrounded numbers).
function mfGrowthProjectionData(mfPositions) {
  const invested = mfPositions.reduce((s, p) => s + impliedCostBasis(p), 0);
  const totalValue = mfPositions.reduce((s, p) => s + p.current_value, 0);
  const years = 8;
  const rand = seededRandom(Math.round(invested + totalValue));
  const startYear = 2026 - years;
  const investedSeries = [], valueSeries = [];
  for (let i = 0; i <= years; i++) {
    const t = i / years;
    const inv = invested * (0.08 + 0.92 * t);
    const noise = 1 + (rand() - 0.5) * 0.04;
    const val = i === years ? totalValue : (totalValue * (0.1 + 0.9 * Math.pow(t, 1.15))) * noise;
    investedSeries.push({ year: startYear + i, value: Math.round(inv) });
    valueSeries.push({ year: startYear + i, value: Math.round(val) });
  }
  const bench = BENCHMARKS.nifty50;
  const annualRate = Math.pow(1 + bench.return3mo, 4) - 1;
  const projSeries = [{ year: 2026, value: Math.round(totalValue) }];
  let pv = totalValue;
  for (let i = 1; i <= 10; i++) { pv = pv * (1 + annualRate); projSeries.push({ year: 2026 + i, value: Math.round(pv) }); }
  return { investedSeries, valueSeries, projSeries, annualRate, benchLabel: bench.label };
}
function YearChart({ seriesList, height = 170 }) {
  const w = 720, pad = 8, padBottom = 20;
  const allPoints = seriesList.flatMap(s => s.points);
  const years = [...new Set(allPoints.map(p => p.year))].sort((a, b) => a - b);
  const minY = years[0], maxY = years[years.length - 1];
  const maxVal = Math.max(...allPoints.map(p => p.value), 1);
  function x(year) { return pad + ((year - minY) / (maxY - minY || 1)) * (w - pad * 2); }
  function y(val) { return (height - padBottom) - (val / maxVal) * (height - padBottom - pad); }
  function pathFor(points) { return points.map((p, i) => `${i === 0 ? 'M' : 'L'}${x(p.year).toFixed(1)},${y(p.value).toFixed(1)}`).join(' '); }
  const step = Math.max(1, Math.ceil(years.length / 6));
  const yearTicks = years.filter((yr, i) => i === 0 || i === years.length - 1 || i % step === 0);
  return html`
    <svg viewBox="0 0 ${w} ${height}" width="100%" height=${height} preserveAspectRatio="none">
      ${seriesList.map(s => html`<path key=${s.key} d=${pathFor(s.points)} fill="none" stroke=${s.color} stroke-width=${s.width || 2.2} stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=${s.dashed ? '5 4' : 'none'} opacity=${s.dashed ? 0.75 : 1} />`)}
      ${yearTicks.map(yr => html`<text key=${yr} x=${x(yr)} y=${height - 4} font-size="9" fill="var(--text-tertiary)" text-anchor="middle">${yr}</text>`)}
    </svg>
  `;
}

// 13  Screen: Money — real HDFC Infinia credit-card data, scoped to 2026 only
// (6 statements, Feb–Jul, covering real Jan–Jun spend — the Dec'25/Jan'26
// statement is excluded). Two real data layers: statement summaries

// and, new this pass, 514 real individual transactions transcribed from the
// statement PDFs (credit-card-transactions.js) — merchant, date, amount,
// cardholder. No bank/savings statement exists for either member, so income,
// true savings rate, and the memo's spend/invest reconciliation (§14, "the
// closing loop") stay honestly gap-noted, not fabricated.
// ============================================================
function monthLabel(dateStr) { return new Date(dateStr + 'T00:00:00').toLocaleDateString('en-IN', { month: 'short' }); }

function spendTrendData() { return creditCardStatements.map(s => ({ label: monthLabel(s.statement_date), value: s.purchases })); }
function utilizationTrendData() { return creditCardStatements.map(s => ({ label: monthLabel(s.statement_date), value: (1 - s.available_credit_limit / s.credit_limit) * 100 })); }
function financeChargeSummary() {
  const totalCharges = creditCardStatements.reduce((s, st) => s + (st.finance_charges || 0), 0);
  const monthsWithCharges = creditCardStatements.filter(s => s.finance_charges > 0).length;
  return { totalCharges, monthsWithCharges, monthsTracked: creditCardStatements.length };
}
// The straight average gets pulled upward by one real, disclosed anomaly (the
// Europe trip). A "typical month" excluding that outlier is a more honest
// baseline than a single flattened average — real numbers, just not blended.
function typicalMonthData() {
  const sorted = [...creditCardStatements].sort((a, b) => a.purchases - b.purchases);
  const mid = sorted.length / 2;
  const median = sorted.length % 2 ? sorted[(sorted.length - 1) / 2].purchases : (sorted[mid - 1].purchases + sorted[mid].purchases) / 2;
  const outliers = creditCardStatements.filter(s => s.purchases > median * 1.6);
  const normal = creditCardStatements.filter(s => s.purchases <= median * 1.6);
  const mean = creditCardStatements.reduce((s, st) => s + st.purchases, 0) / creditCardStatements.length;
  const typical = normal.length ? normal.reduce((s, st) => s + st.purchases, 0) / normal.length : median;
  return { mean, typical, outliers };
}
function notableEvents() {
  return creditCardStatements.filter(s => s.note).map(s => ({ label: monthLabel(s.statement_date), note: s.note }));
}

// ---- Real per-transaction categorisation — deterministic, merchant-name rules.
// This is exactly what a "reclassify" click overrides; the auto-assignment is a
// starting point, not a claim of certainty, same discipline as fundCategoryOf().
const TXN_CATEGORIES = ['Food delivery', 'Groceries', 'Dining out', 'Shopping', 'Travel', 'Transport', 'Fuel', 'Utilities & telecom', 'Subscriptions', 'Housing & rent', 'Health & wellness', 'Fees & taxes', 'Other'];
function categorizeTransaction(merchant) {
  const m = merchant.toLowerCase();
  if (m.startsWith('europe trip') || /yatra|goibibo|getyourguide|etraveli|aegean|booking\.com|airport lounge/.test(m)) return 'Travel';
  if (/swiggy|zomato|bundl technolog/.test(m)) return 'Food delivery';
  if (/mini market|blinkit|instamart|bigbasket/.test(m)) return 'Groceries';
  if (/delightful gourmet|chaayos|jubilant foodworks|mcdonald|mtr maiyas|licious|blue tokai|araku coffee|westend coffee|beer works|aydi restaurants|chef bakers|coco leni|navu bistro|aldrome|skyrocket beverages|mall of asia|loyal world market|bhoomi hardware/.test(m)) return 'Dining out';
  if (/amazon|flipkart|ikea|croma|myntra|zudio|puma|skechers|hennes n mauritz|titan company|honasa consumer|haut luxe|blink commerce|page industries|miraggio|smartbuy|nikham innovations/.test(m)) return 'Shopping';
  if (/uber/.test(m)) return 'Transport';
  if (/petrol|fuel|gas bill/.test(m)) return 'Fuel';
  if (/airtel|postpaid/.test(m)) return 'Utilities & telecom';
  if (/netflix|youtube|linkedin|anthropic|claude|saily|firstclub|beautiful bizarre|font bundles|centrohelp|international subscriptions/.test(m)) return 'Subscriptions';
  if (/nobroker/.test(m)) return 'Housing & rent';
  if (/mymuse|manmatters|himalaya wellness|bridge health|png health|varma hospitality/.test(m)) return 'Health & wellness';
  if (/goods and services tax|card reissue/.test(m)) return 'Fees & taxes';
  return 'Other';
}
function realCategoryData(overrides) {
  const totals = new Map();
  let total = 0;
  creditCardTransactions.forEach(t => {
    const cat = overrides[t.id] || categorizeTransaction(t.merchant);
    totals.set(cat, (totals.get(cat) || 0) + t.amount);
    total += t.amount;
  });
  const bars = [...totals.entries()].sort((a, b) => b[1] - a[1]).map(([label, value], i) => ({ label, value, pct: total ? value / total : 0, color: LENS_PALETTE[i % LENS_PALETTE.length] }));
  return { bars, total };
}

function MonthlyChart({ series, height = 190, format = v => Math.round(v).toLocaleString('en-IN') }) {
  const w = 720, pad = 8, padBottom = 20, padTop = 22;
  const maxVal = Math.max(...series.map(p => p.value), 1);
  const minVal = Math.min(0, ...series.map(p => p.value));
  const range = (maxVal - minVal) || 1;
  function x(i) { return pad + (i / (series.length - 1 || 1)) * (w - pad * 2); }
  function y(val) { return (height - padBottom) - ((val - minVal) / range) * (height - padBottom - padTop - pad); }
  const path = series.map((p, i) => `${i === 0 ? 'M' : 'L'}${x(i).toFixed(1)},${y(p.value).toFixed(1)}`).join(' ');
  return html`
    <svg viewBox="0 0 ${w} ${height}" width="100%" height=${height} preserveAspectRatio="none">
      <path d=${path} fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
      ${series.map((p, i) => html`<circle key=${i} cx=${x(i)} cy=${y(p.value)} r="3.2" fill="var(--accent)" />`)}
      ${series.map((p, i) => html`<text key=${'v' + i} x=${x(i)} y=${y(p.value) - 10} class="chart-value-label" text-anchor="middle">${format(p.value)}</text>`)}
      ${series.map((p, i) => html`<text key=${'t' + i} x=${x(i)} y=${height - 4} font-size="9" fill="var(--text-tertiary)" text-anchor="middle">${p.label}</text>`)}
    </svg>
  `;
}

// the render layer" (which is about not silently deriving real historical

// is expected to compute, as long as every assumption stays named and visible.
// Companion to investment-plan-20cr.html (same numbers, standalone doc + citations).
// ============================================================
const GOAL_PLAN = {
  goal: 200000000,
  months: 120,
  fd: 2954000, epfExisting: 5313080, gold: 3236413,
  fdRate: 0.075, epfRate: 0.0825, goldRate: 0.08,
  epfMonthlyContrib: 69400, // ₹34,700 employee + ₹34,700 employer, flat — no salary step-up modeled
  sipStart: 234000, stepup: 0.05,
  mayLumpsum: 1000000, // every May, invested in the same allocation as the monthly SIP
  mayMonths: [9, 21, 33, 45, 57, 69, 81, 93, 105, 117], // month index of each May (start = Sep2026 = month 1)
  scenarios: {
    optimistic: { existing: 0.17, sip: 0.143, label: 'Optimistic', tone: 'gain' },
    base: { existing: 0.10, sip: 0.091, label: 'Base case', tone: '' },
    pessimistic: { existing: 0.02, sip: 0.0335, label: 'Pessimistic', tone: 'critical' },
  },
};
GOAL_PLAN.marketExisting = householdTotals.current_total - GOAL_PLAN.fd - GOAL_PLAN.epfExisting - GOAL_PLAN.gold;

function gpFvLump(pv, rate, months) { return pv * Math.pow(1 + rate / 12, months); }
function gpFvFlatAnnuity(monthly, rate, months) {
  const r = rate / 12; let fv = 0;
  for (let m = 1; m <= months; m++) fv += monthly * Math.pow(1 + r, months - m);
  return fv;
}
function gpFvGrowingSip(start, rate, stepup, months) {
  const r = rate / 12; let fv = 0, cur = start;
  for (let m = 1; m <= months; m++) { fv += cur * Math.pow(1 + r, months - m); if (m % 12 === 0) cur *= (1 + stepup); }
  return fv;
}
function gpFvMayLumpsums(rate, months) {
  const r = rate / 12; let fv = 0, mm = GOAL_PLAN.mayMonths[0];
  while (mm <= months) { fv += GOAL_PLAN.mayLumpsum * Math.pow(1 + r, months - mm); mm += 12; }
  return fv;
}
function gpTotal(rates, months, sipStart = GOAL_PLAN.sipStart) {
  const P = GOAL_PLAN;
  return gpFvLump(P.fd, P.fdRate, months) + gpFvLump(P.epfExisting, P.epfRate, months) + gpFvFlatAnnuity(P.epfMonthlyContrib, P.epfRate, months)
       + gpFvLump(P.gold, P.goldRate, months) + gpFvLump(P.marketExisting, rates.existing, months)
       + gpFvGrowingSip(sipStart, rates.sip, P.stepup, months) + gpFvMayLumpsums(rates.sip, months);
}
function gpYearSeries(rates) {
  const P = GOAL_PLAN;
  const rows = [{ year: 2026, value: householdTotals.current_total }];
  let sipMonthly = P.sipStart, fd = P.fd, epfE = P.epfExisting, epfC = 0, gold = P.gold, mkt = P.marketExisting, sipCorpus = 0, mayCorpus = 0;
  const rFD = P.fdRate / 12, rEPF = P.epfRate / 12, rGold = P.goldRate / 12, rEx = rates.existing / 12, rSip = rates.sip / 12;
  for (let m = 1; m <= P.months; m++) {
    fd *= (1 + rFD); epfE *= (1 + rEPF); gold *= (1 + rGold); mkt *= (1 + rEx);
    epfC = epfC * (1 + rEPF) + P.epfMonthlyContrib;
    sipCorpus = sipCorpus * (1 + rSip) + sipMonthly;
    mayCorpus = mayCorpus * (1 + rSip) + (P.mayMonths.includes(m) ? P.mayLumpsum : 0);
    if (m % 12 === 0) { sipMonthly *= (1 + P.stepup); rows.push({ year: 2026 + m / 12, value: fd + epfE + epfC + gold + mkt + sipCorpus + mayCorpus }); }
  }
  return rows;
}
function gpMonthsToGoal(rates) {
  let m = 1;
  while (gpTotal(rates, m) < GOAL_PLAN.goal && m < 40 * 12) m++;
  return m;
}

  const memberNames = household.members.map(id => members[id].name);
  const current = NAV_ITEMS.find(t => t.id === tab);
  return html`
    <div>
      <${TopNav} tab=${tab} onNavigate=${setTab} memberNames=${memberNames} />
      <div class="content">
        ${tab === 'today' && html`<${TodayScreen} onNavigate=${setTab} />`}
        ${tab === 'portfolio' && html`<${PortfolioScreen} onNavigate=${setTab} />`}
        ${tab === 'insights' && html`<${InsightsScreen} />`}
        ${tab === 'money' && html`<${MoneyScreen} />`}
        ${tab === 'goal' && html`<${GoalPlanScreen} />`}
        ${tab !== 'today' && tab !== 'portfolio' && tab !== 'insights' && tab !== 'money' && tab !== 'goal' && html`<${ComingSoonScreen} name=${current.label} stage=${current.stage} />`}
      </div>
    </div>
  `;
}

// ============================================================
// 17  Mount
// ============================================================
render(html`<${AppShell} />`, document.getElementById('app'));
</script>
</body>
</html>
